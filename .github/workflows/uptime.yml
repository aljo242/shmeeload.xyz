name: uptime

# External uptime probe for the live site. Runs on a GitHub-hosted runner on
# purpose (not the self-hosted foundry runner): the point is an outside vantage
# that can also catch a home-network outage. A failed run emails the repo owner.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe https://djinntek.space
        run: |
          set -e
          # curl validates the TLS cert by default, so an expired/invalid cert
          # also fails this. --http2 confirms the negotiated stack works.
          code=$(curl -sS --http2 --max-time 25 -o /dev/null -w '%{http_code}' https://djinntek.space/home)
          echo "GET /home -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::djinntek.space returned $code (expected 200)"
            exit 1
          fi
      - name: Check www redirect
        run: |
          set -e
          code=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' https://www.djinntek.space/home)
          echo "GET www/home -> HTTP $code"
          # 301 (redirect to apex) or 200 are both fine; anything else is a problem.
          case "$code" in
            200|301|308) ;;
            *) echo "::error::www.djinntek.space returned $code"; exit 1 ;;
          esac
      - name: Probe Valheim server health via the site
        if: always()
        run: |
          # The Minecraft probe this replaced opened a TCP connection to
          # gamer.djinntek.space:25565. Valheim cannot be checked that way:
          # it is UDP 2456-2457, and a UDP probe that gets no reply is
          # indistinguishable from a firewall drop, so it would produce either
          # false alarms or false confidence. Its Steam A2S query port only
          # answers when the server is public, and this one is deliberately
          # private and password-only.
          #
          # So this checks a weaker but honest thing: the site reports the game
          # server as running and recently reported. KNOWN GAP: it does NOT
          # verify UDP 2456 is reachable from the internet, which the old probe
          # did for Minecraft. A broken port forward would pass this check.
          body=$(curl -sS --max-time 25 https://djinntek.space/gamers/valheim)
          echo "$body"
          up=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("up"), d.get("known"), d.get("stale"))')
          case "$up" in
            "True True False") echo "valheim -> up and reporting fresh" ;;
            *"False"*)         echo "::error::valheim status is not healthy: $up"; exit 1 ;;
            *)                 echo "::error::unexpected valheim status: $up"; exit 1 ;;
          esac
