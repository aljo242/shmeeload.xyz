version: "2"
run:
  tests: true
  timeout: 5m
linters:
  default: none
  enable:
    - bodyclose
    - canonicalheader
    - dogsled
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    dogsled:
      max-blank-identifiers: 3
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
    revive:
      severity: warning
      rules:
        - name: unused-parameter
          disabled: true
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files routinely repeat literal strings and read/write files from
      # variable paths; those checks are noise here, not real risks.
      - linters:
          - goconst
          - gosec
        path: _test\.go
      # httptest.NewRequest and short-lived test dials don't need a context or a
      # body close; these linters are meant to guard production code, not tests.
      - linters:
          - bodyclose
          - noctx
        path: _test\.go
      - linters:
          - gosec
        text: Use of weak random number generator
      # cmd/genimg is a build-time tool that walks and rewrites the app's own
      # site tree (not user input), so the file-path/TOCTOU/perms warnings on
      # ReadFile/WriteFile/WalkDir are noise here, not real risks.
      - linters:
          - gosec
        path: cmd/genimg/
      - linters:
          - golint
        text: comment on exported var
      - linters:
          - golint
        text: don't use an underscore in package name
      - linters:
          - staticcheck
        text: 'ST1003:'
      - linters:
          - staticcheck
        text: 'ST1016:'
      - linters:
          - staticcheck
        path: migrations
        text: 'SA1019:'
    paths:
      - third_party$
      - builtin$
      - examples$
      - web_res
issues:
  max-issues-per-linter: 10000
  max-same-issues: 10000
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - web_res
