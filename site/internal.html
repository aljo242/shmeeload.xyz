<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <base href="/"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <meta name="theme-color" content="#0b0f14"/>
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="description" content="Internal homelab view."/>
    <title>homelab internal</title>
    <link rel="shortcut icon" href="/static/img/1favicon.ico" type="image/x-icon"/>
    <style>
      html, body { margin: 0; background: #0b0f14; }
      body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #dfe6ee; min-height: 100vh; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
      h1 { font-size: 20px; font-weight: 700; margin: 0 0 2px; letter-spacing: 0.3px; }
      .muted { color: #7d8b99; font-size: 13px; }
      .panel { background: #121821; border: 1px solid #223041; border-radius: 10px; padding: 16px 18px; margin: 16px 0; }
      .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8fb7ff; margin: 0 0 12px; display:flex; align-items:center; gap:8px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background:#556; display:inline-block; }
      .dot.up { background:#37d67a; box-shadow:0 0 8px #37d67a66; }
      .dot.down { background:#ff5a5a; box-shadow:0 0 8px #ff5a5a66; }
      .grid { display:flex; flex-wrap:wrap; gap: 22px; }
      .stat .n { font-size: 30px; font-weight: 800; line-height: 1.1; }
      .stat .l { font-size: 12px; color:#7d8b99; text-transform: uppercase; letter-spacing: 0.5px; }
      .n.block { color:#ff9d3c; }
      .n.pct { color:#37d67a; }
      table { width:100%; border-collapse: collapse; margin-top: 6px; font-size: 14px; }
      td { padding: 6px 4px; border-bottom: 1px solid #1b2431; }
      td.c { text-align:right; color:#ff9d3c; font-variant-numeric: tabular-nums; width: 72px; font-weight:700; }
      td.d { color:#cfe; word-break: break-all; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
      a { color:#8fb7ff; }
    </style>
</head>
<body>
  <div class="wrap">
    <h1>homelab &mdash; internal</h1>
    <div class="muted" id="checked">loading&hellip;</div>

    <div class="panel">
      <h2><span class="dot" id="ph-dot"></span> Pi-hole</h2>
      <div class="grid">
        <div class="stat"><div class="n" id="ph-queries">--</div><div class="l">queries (24h)</div></div>
        <div class="stat"><div class="n block" id="ph-blocked">--</div><div class="l">blocked</div></div>
        <div class="stat"><div class="n pct" id="ph-pct">--</div><div class="l">blocked %</div></div>
        <div class="stat"><div class="n" id="ph-list">--</div><div class="l">blocklist</div></div>
        <div class="stat"><div class="n" id="ph-clients">--</div><div class="l">clients</div></div>
      </div>
      <table><tbody id="ph-top"></tbody></table>
    </div>

    <div class="panel">
      <h2><span class="dot" id="mc-dot"></span> Minecraft</h2>
      <div class="grid">
        <div class="stat"><div class="n" id="mc-online">--</div><div class="l">online</div></div>
        <div class="stat"><div class="n" id="mc-tps">--</div><div class="l">TPS</div></div>
        <div class="stat"><div class="n" id="mc-day">--</div><div class="l">day</div></div>
      </div>
    </div>
  </div>
  <script type="module" src="/static/js/internal.js"></script>
</body>
</html>
